spring:
  application:
    name: educa-visual-api

  datasource:
    url: ${DATABASE_URL:jdbc:h2:file:./data/educa_visual_db;MODE=PostgreSQL;AUTO_SERVER=TRUE}
    username: ${DATABASE_USER:sa}
    password: ${DATABASE_PASSWORD:}

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
    show-sql: false

  h2:
    console:
      enabled: true
      path: /h2-console

server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

app:
  jwt:
    # Troque este segredo antes de publicar. Em produção use a variável de ambiente JWT_SECRET.
    secret: ${JWT_SECRET:educa-visual-chave-jwt-local-com-no-minimo-32-bytes-2026}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  cors:
    # Lista separada por vírgulas. Em produção, use CORS_ALLOWED_ORIGINS.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://localhost:8000}
  # Pasta com as imagens dos exercícios, servidas em /imagens/**
  imagens-dir: ${IMAGENS_DIR:../frontend/assets}
