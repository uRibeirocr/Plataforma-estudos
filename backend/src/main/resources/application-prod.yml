# Perfil de produção: SPRING_PROFILES_ACTIVE=prod
# Variáveis obrigatórias: DATABASE_URL (jdbc:postgresql://host:5432/db), DATABASE_USER,
# DATABASE_PASSWORD e JWT_SECRET (mínimo 32 caracteres). Sem valor padrão de propósito.
spring:
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USER}
    password: ${DATABASE_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    properties:
      hibernate:
        format_sql: false
  h2:
    console:
      enabled: false

app:
  jwt:
    secret: ${JWT_SECRET}
