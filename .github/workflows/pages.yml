name: Site (GitHub Pages)

# Gera a versão web das atividades (site/) e publica no GitHub Pages quando o main muda.
# Em pull requests e branches só constrói (para validar), sem publicar.
# Uma vez: Settings > Pages > Build and deployment > Source = "GitHub Actions".
on:
  push:
    branches: [main, "fix/**", "feat/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Gerar site estático
        run: python site/build_site.py _site
      - name: Preparar artefato do Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
