name: CI

on:
  push:
    branches: [main, "fix/**", "feat/**"]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: API Java (build + testes)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Compilar e testar
        run: mvn -B -ntp -f backend/pom.xml verify
      - name: Relatório dos testes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: backend/target/surefire-reports
          if-no-files-found: ignore

  conteudo-e-frontend:
    name: Conteúdo + lógica do frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validar questões e imagens
        run: python scripts/validar_conteudo.py
      - name: Testes da lógica do frontend
        run: python -m unittest discover -s frontend/tests -t frontend -v
      - name: Checar sintaxe das telas
        run: python -m compileall -q frontend scripts
