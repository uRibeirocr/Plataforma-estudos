spring:
  application:
    name: educa-visual-api

  datasource:
    url: jdbc:h2:file:./data/educa_visual_db;MODE=PostgreSQL;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
    show-sql: false

  h2:
    console:
      enabled: true
      path: /h2-console

server:
  port: 8080

app:
  jwt:
    # Troque este segredo antes de publicar. Em produção, prefira variável de ambiente.
    secret: ${JWT_SECRET:educa-visual-chave-jwt-local-com-no-minimo-32-bytes-2026}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
